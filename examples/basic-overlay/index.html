<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Basic overlay</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          16px system-ui,
          sans-serif;
      }
      body {
        margin: 24px;
        background: #171923;
        color: #f1f3f9;
      }
      h1 {
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <h1>Basic overlay</h1>
    <p>
      This page is rendered by Electron. See the terminal for attachment status.
    </p>
    <p>Smoke mode checks this page only; it does not attach to a game.</p>
  </body>
</html>
