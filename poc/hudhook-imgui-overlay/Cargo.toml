[workspace]
members = [
    "crates/injector",
    "crates/overlay-ui",
    "crates/payload-dx11",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
hudhook = { version = "=0.9.1", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tracing-subscriber = { version = "=0.3.19", default-features = false, features = [
    "env-filter",
    "fmt",
] }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
