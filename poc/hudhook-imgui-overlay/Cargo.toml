[workspace]
members = [
    "crates/injector",
    "crates/overlay-ui",
    "crates/payload-dx11",
    "crates/payload-dx12",
]
exclude = ["vendor/hudhook"]
resolver = "2"

[patch.crates-io]
# hudhook 0.9.1 defers WM_INPUT decoding until Present and tears custom hooks
# down after freeing MinHook trampolines. This local patch owns raw input while
# valid, safely drains hook callbacks, and supplies bounded User32 suppression.
hudhook = { path = "vendor/hudhook" }

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
hudhook = { version = "=0.9.1", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tracing-subscriber = { version = "=0.3.19", default-features = false, features = [
    "env-filter",
    "fmt",
] }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
