<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple overlay windows</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <main class="panel">
      <header>
        <span class="eyebrow">Overlay window</span>
        <h1 data-title>Panel</h1>
      </header>
      <p data-description></p>
      <p class="status" data-status>Starting the overlay session…</p>
      <button type="button" data-action>Action</button>
      <a
        class="attribution"
        href="https://github.com/hiitiger/goverlay"
        target="_blank"
        rel="noopener noreferrer"
      >
        Powered by GOverlay
      </a>
    </main>
    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
