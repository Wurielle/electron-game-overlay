<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Target follow and telemetry</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <main class="panel">
      <header>
        <div>
          <span class="eyebrow">Live target geometry</span>
          <h1>Follow + telemetry</h1>
        </div>
        <span class="badge" data-phase data-value="starting">starting</span>
      </header>
      <p class="target" data-target>Waiting for target</p>
      <p class="detail" data-detail>Starting</p>
      <div class="modes" aria-label="Target follow mode">
        <button type="button" data-mode="render">Render bounds</button>
        <button type="button" data-mode="client">Client bounds</button>
        <button type="button" data-mode="stopped">Stop following</button>
      </div>
      <p class="metrics" data-metrics>Waiting for a target surface</p>
      <h2>Recent SDK events</h2>
      <ul data-events></ul>
    </main>
    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
