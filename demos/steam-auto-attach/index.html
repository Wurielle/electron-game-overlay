<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steam auto-attach</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <main class="panel">
      <header>
        <div>
          <span class="eyebrow">Process watcher → exact PID</span>
          <h1>Steam auto-attach</h1>
        </div>
        <span class="count"><b data-count>0</b> live</span>
      </header>
      <p class="watcher"><span></span><span data-watcher>starting</span></p>
      <p class="contract">
        Attempts every <code>**/steamapps/**.exe</code>; no helper exclusions.
      </p>
      <section class="targets" data-targets>
        <p class="empty">Launch a Steam executable to see an attachment.</p>
      </section>
    </main>
    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
