<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input interception</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <main class="panel" data-panel data-intercepting="false">
      <header>
        <span class="eyebrow">Input policy</span>
        <h1>Press <kbd data-shortcut>Ctrl+I</kbd></h1>
      </header>
      <div class="mode"><span></span><strong data-mode>Released</strong></div>
      <p data-attachment>Starting the overlay session…</p>
      <button type="button" data-toggle>Intercept game input</button>
      <small>
        The button becomes clickable after interception routes pointer input to
        Electron.
      </small>
    </main>
    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
