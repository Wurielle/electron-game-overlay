<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exact process attachment</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <main class="panel">
      <header class="titlebar">
        <span class="eyebrow">electron-game-overlay</span>
        <span class="badge" data-phase data-value="starting">starting</span>
      </header>
      <section>
        <h1>Exact process attachment</h1>
        <p class="target" data-target>Waiting for target details</p>
        <p class="detail" data-detail>Starting</p>
      </section>
      <button type="button" data-intercept aria-pressed="false">
        Intercept game input
      </button>
      <p class="hint">
        Drag this card by its header. Input interception is explicit.
      </p>
      <a
        class="attribution"
        href="https://github.com/hiitiger/goverlay"
        target="_blank"
        rel="noopener noreferrer"
      >
        Powered by GOverlay
      </a>
    </main>
    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
