<html>
  <head>
    <style>
      body {
        background-color: transparent;
        margin: 0px;
        overflow: hidden;
      }

      .content {
        background-color: rgba(61, 70, 73, 0.25);
        border-radius: 100px;
        padding: 30px;
      }

      h1 {
        color: maroon;
        margin-left: 40px;
      }

      .caption {
        height: 40px;
        background-color: brown;
      }
    </style>
    <title>Example Popup Overlay</title>
  </head>

  <body>
    <div class="content">
      <div class="caption"></div>
      <button id="button">intercept</button>
      <br />
      offscreen window!

      <input type="text" /><input />
    </div>
    <script>
      const { ipcRenderer, remote } = window.require('electron');
      const label = document.getElementById('label');
      const button = document.getElementById('button');
      button.addEventListener('click', () => {
        ipcRenderer.send('stopIntercept');
      });
    </script>
    <a
      href="https://github.com/hiitiger/goverlay"
      target="_blank"
      rel="noopener noreferrer"
      style="
        position: fixed;
        right: 10px;
        bottom: 5px;
        color: #8fa3a6;
        font-size: 9px;
      "
      >Powered by GOverlay</a
    >
  </body>
</html>
