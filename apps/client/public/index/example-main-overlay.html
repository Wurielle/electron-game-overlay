<html>
  <head>
    <style>
      :root {
        color-scheme: dark;
        --main-surface: #151c28;
        --main-caption: #202b3c;
        --main-text: #edf3fc;
        --main-muted: #afbed3;
        --main-border: #465771;
        --main-focus: #8bc5ff;
      }
      * { box-sizing: border-box; }
      body {
        background: var(--main-surface);
        color: var(--main-text);
        margin: 0;
        font: 14px/1.5 system-ui, sans-serif;
      }
      .caption {
        height: 40px;
        padding: 9px 24px;
        background: var(--main-caption);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .caption span { float: right; color: var(--main-muted); font-weight: 400; letter-spacing: 0; }
      main { padding: 14px 24px; }
      .actions { display: flex; gap: 10px; margin-bottom: 0; }
      button, input { font: inherit; border: 1px solid var(--main-border); border-radius: 6px; }
      button { min-height: 36px; padding: 6px 12px; color: var(--main-text); background: var(--main-caption); cursor: pointer; }
      button:hover { background: #334660; }
      button:active { background: #405b7c; }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--main-focus); outline-offset: 2px; }
      #hide-main-overlay { margin-left: auto; }
      .input-label { display: block; color: var(--main-muted); margin-bottom: 4px; }
      input { height: 36px; width: 280px; padding: 6px 10px; background: #0d1420; color: var(--main-text); }
      input::placeholder { color: var(--main-muted); }
      .help, .timestamp { display: block; color: var(--main-muted); font-size: 12px; }
      .input-row { min-height: 36px; }
      .help { margin: 12px 0; }

      #hudhook-input-diagnostic {
        position: fixed;
        right: 10px;
        bottom: 10px;
        max-width: 420px;
        padding: 5px 8px;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.72);
        color: #d6f8ff;
        font: 12px monospace;
        pointer-events: none;
      }

      .gun-frog-proof-button {
        position: fixed;
        box-sizing: border-box;
        width: 335px;
        height: 56px;
        border: 4px solid #ffffff;
        border-radius: 8px;
        box-shadow:
          0 0 0 3px #111827,
          0 4px 14px #000000;
        color: #ffffff;
        cursor: pointer;
        font: 900 20px sans-serif;
        letter-spacing: 1px;
        opacity: 0.96;
        text-shadow: 0 2px 2px #000000;
        z-index: 2147483647;
      }
    </style>
    <title>Example Main Overlay</title>
  </head>

  <body>
    <div>
      <header class="caption">MAIN OVERLAY <span>Drag to move</span></header>
      <main>
        <div class="actions">
          <button id="show-popup-overlay" type="button">Open popup</button>
          <button id="show-video-overlay" type="button">Open video</button>
          <button id="hide-main-overlay" type="button">Hide Main</button>
        </div>
        <label class="input-label" for="hudhook-client-input-target">Test keyboard input</label>
        <div class="input-row">
          <input id="hudhook-client-input-target" type="text" autocomplete="off" placeholder="Type here to test overlay input" />
        </div>
        <p class="help">Hide keeps your text. Reopen Main from the overlay controls.</p>
        <label id="label" class="timestamp"></label>
        <div id="hudhook-input-diagnostic" role="status">DOM input: waiting</div>
      </main>
    </div>
    <script>
      const label = document.getElementById('label');
      setInterval(() => {
        label.innerText = new Date().toString();
        // console.log(label.innerText)
      }, 1000);

      const { ipcRenderer } = window.require('electron');

      document.getElementById('hide-main-overlay').addEventListener('click', () => {
        void ipcRenderer.invoke(
          'overlay:set-window-visible',
          'example-main-overlay',
          false,
        ).catch((error) => {
          console.error('Unable to hide Main overlay', error);
        });
      });

      const popupButton = document.getElementById('show-popup-overlay');
      popupButton.addEventListener('click', () => {
        console.log('button click ', new Date().toString());
        ipcRenderer.send('showExamplePopupOverlay');
      });

      const videoButton = document.getElementById('show-video-overlay');
      videoButton.addEventListener('click', () => {
        ipcRenderer.send('showExampleVideoOverlay');
      });

      const inputTarget = document.getElementById(
        'hudhook-client-input-target',
      );
      const inputDiagnostic = document.getElementById(
        'hudhook-input-diagnostic',
      );
      const diagnosticEvents = [
        'mouseover',
        'mousedown',
        'mouseup',
        'click',
        'focusin',
        'input',
        'keydown',
        'keyup',
        'wheel',
      ];
      const diagnosticTarget = (event) => {
        const target = event.target;
        if (!(target instanceof Element)) {
          return 'unknown';
        }
        return target.id || target.tagName.toLowerCase();
      };
      const showInputDiagnostic = (event, log) => {
        const point =
          Number.isFinite(event.clientX) && Number.isFinite(event.clientY)
            ? ` @ ${Math.round(event.clientX)},${Math.round(event.clientY)}`
            : '';
        const value =
          event.type === 'input' && event.target instanceof HTMLInputElement
            ? ` value=${JSON.stringify(event.target.value)}`
            : '';
        const message = `${event.type} target=${diagnosticTarget(event)}${point}${value}`;
        inputDiagnostic.textContent = `DOM input: ${message}`;
        if (log) {
          console.log(`HUDHOOK_CLIENT_INPUT_DIAGNOSTIC ${message}`);
        }
      };
      document.addEventListener(
        'mousemove',
        (event) => {
          showInputDiagnostic(event, false);
        },
        true,
      );
      diagnosticEvents.forEach((type) => {
        document.addEventListener(
          type,
          (event) => {
            showInputDiagnostic(event, true);
          },
          true,
        );
      });

      let hudhookInputProofEnabled = false;
      window.hudhookInputProof = {
        enable() {
          if (hudhookInputProofEnabled) {
            return;
          }
          hudhookInputProofEnabled = true;
          Object.assign(inputTarget.style, {
            position: 'fixed',
            left: '24px',
            top: '112px',
            width: '240px',
          });
          inputTarget.value = '';
          const targetRect = inputTarget.getBoundingClientRect();
          inputDiagnostic.textContent = `DOM input proof: ready @ ${Math.round(targetRect.x)},${Math.round(targetRect.y)}`;
          console.log(
            `HUDHOOK_CLIENT_INPUT_PROOF_READY x=${Math.round(targetRect.x)} y=${Math.round(targetRect.y)} width=${Math.round(targetRect.width)} height=${Math.round(targetRect.height)}`,
          );

          inputTarget.addEventListener('focus', () => {
            console.log('HUDHOOK_CLIENT_INPUT_FOCUSED');
          });
          inputTarget.addEventListener('click', () => {
            console.log('HUDHOOK_CLIENT_INPUT_CLICKED');
          });
          inputTarget.addEventListener('input', () => {
            console.log(
              `HUDHOOK_CLIENT_INPUT_VALUE value=${inputTarget.value}`,
            );
          });
          inputTarget.addEventListener('wheel', (event) => {
            console.log(`HUDHOOK_CLIENT_INPUT_WHEEL deltaY=${event.deltaY}`);
          });
          inputTarget.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
              console.log('HUDHOOK_CLIENT_INPUT_ESCAPE_FORWARDED');
            }
          });
        },
        getTargetRect() {
          const rect = inputTarget.getBoundingClientRect();
          return {
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height,
          };
        },
      };

      const gunFrogButtonDefinitions = [
        {
          name: 'continue',
          label: 'CONTINUE',
          left: 36,
          top: 80,
          color: '#dc2626',
        },
        {
          name: 'new-game',
          label: 'NEW GAME',
          left: 36,
          top: 154,
          color: '#ea580c',
        },
        {
          name: 'settings',
          label: 'SETTINGS',
          left: 36,
          top: 227,
          color: '#ca8a04',
        },
        { name: 'quit', label: 'QUIT', left: 36, top: 301, color: '#9333ea' },
      ];
      const gunFrogButtonElements = [];
      window.gunFrogInputProof = {
        enable() {
          if (gunFrogButtonElements.length !== 0) {
            return;
          }
          for (const definition of gunFrogButtonDefinitions) {
            const button = document.createElement('button');
            button.id = `hudhook-gun-frog-${definition.name}`;
            button.type = 'button';
            button.className = 'gun-frog-proof-button';
            button.textContent = `ELECTRON: ${definition.label}`;
            Object.assign(button.style, {
              left: `${definition.left}px`,
              top: `${definition.top}px`,
              background: definition.color,
            });
            button.addEventListener('click', () => {
              console.log(
                `HUDHOOK_CLIENT_MULTIWINDOW_INPUT role=back event=gun-frog-click name=${definition.name}`,
              );
            });
            document.body.appendChild(button);
            gunFrogButtonElements.push({
              name: definition.name,
              element: button,
            });
          }
        },
        getButtonRects() {
          return gunFrogButtonElements.map(({ name, element }) => {
            const rect = element.getBoundingClientRect();
            return {
              name,
              x: rect.x,
              y: rect.y,
              width: rect.width,
              height: rect.height,
            };
          });
        },
      };

      window.onfocus = function () {
        console.log('focus');
      };
      window.onblur = function () {
        console.log('blur');
      };
    </script>
  </body>
</html>
